<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b3d6b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Пингвины-сумо</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ice:#e8f8ff;--deep:#0b3d6b;--accent:#ff9f1c;--good:#37d67a;--bad:#ff5d5d;
  --font:"Trebuchet MS","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0b3d6b;font-family:var(--font);color:#fff;overscroll-behavior:none;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hide{display:none!important}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
input{font-family:inherit;-webkit-user-select:text;user-select:text}

/* ---------- экраны ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));
  background:radial-gradient(ellipse at 50% 30%,rgba(11,61,107,.28),rgba(5,25,50,.78));overflow-y:auto;touch-action:pan-y}
.card{width:min(440px,100%);margin:auto;text-align:center;padding:16px 16px 14px;border-radius:26px;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));border:2px solid rgba(255,255,255,.35);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 12px 40px rgba(0,20,50,.5)}
h1{margin:0;font-size:clamp(28px,7vw,38px);letter-spacing:.5px;text-shadow:0 3px 0 #0a2f55,0 0 18px rgba(120,210,255,.6)}
h2{margin:0 0 8px;font-size:24px;text-shadow:0 2px 0 #0a2f55}
.tag{margin:2px 0 8px;opacity:.9;font-size:15px}
.prev{display:block;margin:0 auto;width:120px;height:120px}
.row{display:flex;gap:8px;justify-content:center;align-items:center;margin:8px 0;flex-wrap:wrap}
#name{width:100%;padding:11px 14px;border-radius:14px;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.92);color:#0a2f55;font-size:18px;font-weight:700;text-align:center;outline:none}
#name:focus{border-color:var(--accent)}
.lvlbar{display:flex;align-items:center;gap:8px;margin:8px 2px 2px;font-size:14px;font-weight:700}
.lvlbar .bar{flex:1;height:10px;border-radius:6px;background:rgba(0,0,0,.3);overflow:hidden}
.lvlbar .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff9f1c);border-radius:6px}
.btn{display:block;width:100%;padding:13px 16px;margin:8px 0;font-size:20px;font-weight:800;border-radius:16px;color:#fff;
  box-shadow:0 5px 0 rgba(0,0,0,.28),0 8px 16px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.main{background:linear-gradient(180deg,#ffb23d,#ff8a00);font-size:23px}
.btn.alt{background:linear-gradient(180deg,#46b6ff,#1f7fd6)}
.btn.sub{background:linear-gradient(180deg,#7d93b0,#566b88);font-size:17px}
.btn.go{background:linear-gradient(180deg,#52e08a,#1fae5b)}
.btn[disabled]{filter:grayscale(.8) brightness(.8);pointer-events:none}
.btn small{display:block;font-size:12px;font-weight:600;opacity:.9;margin-top:1px}
.mini{padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.22);font-size:15px;font-weight:700}
.mini.on{background:rgba(55,214,122,.65)}
#online{font-size:13px;opacity:.9;min-height:16px;margin-top:2px}
#howto{font-size:12.5px;line-height:1.35;opacity:.9;margin-top:6px}
#friends{background:rgba(0,0,0,.2);border-radius:16px;padding:10px;margin:6px 0}
#code{width:120px;padding:10px;border-radius:12px;border:2px solid rgba(255,255,255,.5);background:#fff;color:#0a2f55;font-size:22px;font-weight:800;text-align:center;text-transform:uppercase;letter-spacing:4px;outline:none}
#msg{min-height:20px;font-size:14px;color:#ffd27a;margin-top:2px}
#ver{font-size:11px;opacity:.6;margin-top:4px}

/* ---------- гардероб ---------- */
#tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
#tabs button{padding:7px 11px;border-radius:12px;background:rgba(255,255,255,.2);font-weight:700;font-size:14px}
#tabs button.sel{background:linear-gradient(180deg,#ffb23d,#ff8a00)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;max-height:min(40vh,300px);overflow-y:auto;padding:4px;touch-action:pan-y}
.item{position:relative;border-radius:14px;background:rgba(255,255,255,.16);padding:4px 2px 4px;border:3px solid transparent;font-size:11px;font-weight:700;line-height:1.15}
.item canvas{display:block;margin:0 auto}
.item.sel{border-color:#ffd23f;background:rgba(255,210,63,.25)}
.item .pr{display:block;margin-top:1px;color:#ffe08a}
.item.lock canvas{opacity:.55}
.item.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#coins{font-size:18px;font-weight:800;color:#ffe08a;margin:2px 0}

/* ---------- достижения / настройки ---------- */
#achList{max-height:min(62vh,460px);overflow-y:auto;text-align:left;touch-action:pan-y}
.ach{display:flex;gap:10px;align-items:center;padding:8px;margin:5px 0;border-radius:14px;background:rgba(255,255,255,.14)}
.ach.done{background:rgba(55,214,122,.28)}
.ach .ic{font-size:26px;width:34px;text-align:center}
.ach .tx{flex:1;font-size:13px;line-height:1.25}
.ach .tx b{font-size:15px}
.ach .bar{height:6px;border-radius:4px;background:rgba(0,0,0,.3);margin-top:4px;overflow:hidden}
.ach .bar i{display:block;height:100%;background:#ffd23f}
.ach .rw{font-weight:800;color:#ffe08a;font-size:13px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:8px 6px;font-size:16px;font-weight:700}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud>*{pointer-events:none}
#hud button,#hud #lobby{pointer-events:auto}
#score{position:absolute;left:10px;top:10px;min-width:130px;font-size:14px;font-weight:700;text-shadow:0 2px 3px rgba(0,0,0,.6)}
#score div{display:flex;align-items:center;gap:6px;padding:2px 8px;margin-bottom:2px;border-radius:10px;background:rgba(5,30,60,.45);white-space:nowrap}
#score i{width:11px;height:11px;border-radius:50%;display:inline-block;border:2px solid #fff}
#score b{margin-left:auto;padding-left:8px}
#score .me{background:rgba(255,159,28,.55)}
#score .dead{opacity:.5;text-decoration:line-through}
#top{position:absolute;top:8px;left:50%;transform:translateX(-50%);text-align:center;font-size:14px;font-weight:700;text-shadow:0 2px 3px rgba(0,0,0,.7);line-height:1.25}
#top .big{font-size:18px}
#roomcode{pointer-events:auto!important;display:inline-block;margin-top:2px;padding:2px 10px;border-radius:10px;background:rgba(0,0,0,.35);letter-spacing:3px;font-size:15px}
#tr{position:absolute;right:10px;top:10px;display:flex;gap:6px}
#tr button{width:42px;height:42px;border-radius:14px;background:rgba(5,30,60,.55);font-size:20px;padding:0}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:900;font-size:clamp(44px,min(15vw,15vh),96px);text-shadow:0 4px 0 #0a2f55,0 0 24px rgba(0,0,0,.4);line-height:1.05;padding:0 10px}
#banner small{display:block;font-size:.36em;margin-top:6px;opacity:.95}
#banner.subonly{top:auto;bottom:max(24px,env(safe-area-inset-bottom));font-size:18px;text-shadow:0 2px 4px #000}
#banner.subonly small{font-size:1em;margin:0}
#windmsg{position:absolute;left:0;right:0;top:84px;text-align:center;font-size:22px;font-weight:900;text-shadow:0 2px 6px #000}
#killfeed{position:absolute;right:10px;top:58px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;font-size:13px;font-weight:700}
#killfeed div{padding:3px 9px;border-radius:10px;background:rgba(5,30,60,.6);animation:kf 4.5s forwards;white-space:nowrap}
@keyframes kf{0%{opacity:0;transform:translateX(20px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#final{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(350px,90vw);padding:14px 16px;border-radius:22px;background:linear-gradient(180deg,rgba(11,61,107,.93),rgba(5,25,50,.96));border:2px solid rgba(255,255,255,.4);box-shadow:0 10px 40px rgba(0,0,0,.5);text-align:center}
#final h2{margin:0 0 8px}
#final div{display:flex;align-items:center;gap:8px;padding:5px 8px;margin:3px 0;border-radius:12px;background:rgba(255,255,255,.1);font-weight:700;font-size:16px}
#final div.me{background:rgba(255,159,28,.55)}
#final span{width:26px;font-size:20px}
#final i{width:12px;height:12px;border-radius:50%;border:2px solid #fff}
#final em{font-style:normal;flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#final p{margin:8px 0 0;font-size:13px;opacity:.9}
#final .earn{color:#ffe08a;font-weight:800;font-size:16px}
#dash{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(22px,env(safe-area-inset-bottom));width:104px;height:104px;border-radius:50%;
  background:conic-gradient(rgba(255,255,255,.55) var(--p,0%),#ff8a00 0);border:4px solid rgba(255,255,255,.9);
  font-size:15px;font-weight:900;box-shadow:0 6px 18px rgba(0,0,0,.4);padding:0;touch-action:none}
#dash span{position:absolute;inset:7px;border-radius:50%;background:linear-gradient(180deg,#ffb23d,#ff7a00);display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
#dash span b{font-size:28px}
#dash.cd span{filter:grayscale(.6) brightness(.8)}
#emo{position:absolute;right:max(132px,calc(env(safe-area-inset-right) + 132px));bottom:max(30px,env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center;flex-direction:row-reverse}
#emo button{width:44px;height:44px;border-radius:50%;background:rgba(5,30,60,.55);font-size:22px;padding:0}
#emobtns{display:grid;grid-template-columns:repeat(4,44px);gap:6px;background:rgba(5,30,60,.5);padding:6px;border-radius:18px;position:absolute;bottom:52px;right:0}
#hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:12px;opacity:.7;text-shadow:0 1px 2px #000}

/* ---------- лобби ---------- */
#lobby{position:absolute;left:50%;top:max(8px,env(safe-area-inset-top));transform:translateX(-50%);width:min(380px,calc(100vw - 20px));padding:10px 12px;border-radius:20px;
  background:linear-gradient(180deg,rgba(11,61,107,.88),rgba(5,25,50,.9));border:2px solid rgba(255,255,255,.35);box-shadow:0 8px 30px rgba(0,0,0,.45);text-align:center}
#hud.inlobby #top{display:none}
@media (max-width:620px){#hud.inlobby #lobby{top:max(58px,calc(env(safe-area-inset-top) + 50px))}}
#lobby .hd{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px}
#lobby .code{font-size:24px;letter-spacing:5px;padding:2px 12px;border-radius:12px;background:rgba(255,255,255,.18)}
#lobby .pl{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin:7px 0}
#lobby .pl span{display:flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;background:rgba(255,255,255,.14);font-size:13px;font-weight:700}
#lobby .pl i{width:11px;height:11px;border-radius:50%;border:2px solid #fff}
#lobby .opts{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:4px 0}
#lobby .opts button{padding:6px 10px;border-radius:11px;background:rgba(255,255,255,.18);font-size:13px;font-weight:700}
#lobby .opts button.on{background:rgba(55,214,122,.7)}
#lobby .opts button[disabled]{opacity:.55;pointer-events:none}
#lobby .st{font-size:13px;min-height:18px;opacity:.95;margin:2px 0 4px}
#lobby .btn{margin:4px 0 0;padding:10px 14px;font-size:18px}
@media (max-height:520px){#lobby{width:min(330px,56vw);left:10px;transform:none;top:8px}#lobby .pl{display:none}}
#toasts{position:fixed;left:0;right:0;top:max(60px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:50}
.toast{padding:9px 16px;border-radius:14px;background:rgba(11,61,107,.95);border:2px solid #ffd23f;font-weight:800;font-size:15px;animation:ts 3.6s forwards;max-width:90vw;text-align:center}
@keyframes ts{0%{opacity:0;transform:translateY(-12px)}8%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0}}
@media (max-width:620px){#score{top:80px}#top .big{font-size:15px;white-space:nowrap}#banner.subonly{bottom:max(150px,env(safe-area-inset-bottom))}#killfeed{top:112px}}
@media (max-height:480px){#score{font-size:12px;min-width:110px}#dash{width:88px;height:88px}#banner{top:30%}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="screen">
  <div class="card">
    <canvas id="prev" class="prev" width="240" height="240"></canvas>
    <h1 data-t="title">Пингвины-сумо</h1>
    <p class="tag" data-t="tag">Столкни всех со льдины!</p>
    <input id="name" maxlength="14" autocomplete="off" data-ph="yourName" placeholder="Твоё имя">
    <div class="lvlbar"><span id="lvlTxt"></span><div class="bar"><i id="lvlFill"></i></div><b id="coinsTxt"></b></div>
    <button class="btn main" id="bOnline"><span data-t="online">Играть онлайн</span><small data-t="onlineSub">Быстрый матч с живыми игроками</small></button>
    <button class="btn alt" id="bFriends" data-t="friends">С друзьями (по коду)</button>
    <div id="friends" class="hide">
      <div class="row"><button class="btn sub" id="bCreate" style="margin:0;width:auto;flex:1" data-t="create">Создать комнату</button></div>
      <div class="row"><input id="code" maxlength="4" placeholder="ABCD" autocomplete="off"><button class="btn alt" id="bJoin" style="margin:0;width:auto;font-size:18px" data-t="join">Войти</button></div>
    </div>
    <button class="btn sub" id="bOffline"><span data-t="offline">Против ботов</span><small data-t="offlineSub">Без интернета</small></button>
    <div class="row"><button class="mini" id="bWard">👗 <span data-t="wardrobe">Гардероб</span></button><button class="mini" id="bAch">🏆 <span data-t="achievements">Награды</span></button><button class="mini" id="bSet">⚙️</button><button class="mini hide" id="bInstall" data-t="install">📲 Установить</button></div>
    <div id="msg"></div>
    <div id="online"></div>
    <div id="howto" data-t="howto"></div>
    <div id="ver"></div>
  </div>
</div>

<div id="wardrobe" class="screen hide">
  <div class="card">
    <h2>👗 <span data-t="wardrobe">Гардероб</span></h2>
    <canvas id="wprev" class="prev" width="300" height="300" style="width:150px;height:150px"></canvas>
    <div id="coins"></div>
    <div id="tabs"></div>
    <div id="grid"></div>
    <button class="btn sub" id="bWBack" data-t="back">Назад</button>
  </div>
</div>

<div id="achs" class="screen hide">
  <div class="card">
    <h2>🏆 <span data-t="achievements">Награды</span></h2>
    <div id="achList"></div>
    <button class="btn sub" id="bABack" data-t="back">Назад</button>
  </div>
</div>

<div id="settings" class="screen hide">
  <div class="card">
    <h2>⚙️ <span data-t="settings">Настройки</span></h2>
    <div class="setrow"><span data-t="sfx">Звуки</span><button class="mini" id="tSfx"></button></div>
    <div class="setrow"><span data-t="music">Музыка</span><button class="mini" id="tMusic"></button></div>
    <div class="setrow"><span data-t="vibe">Вибрация</span><button class="mini" id="tVibe"></button></div>
    <div class="setrow"><span data-t="language">Язык</span><button class="mini" id="bLang">RU</button></div>
    <button class="btn alt" id="bUpdate" data-t="update">🔄 Обновить игру</button>
    <button class="btn sub" id="bSBack" data-t="back">Назад</button>
    <div id="ver2" style="font-size:12px;opacity:.7"></div>
  </div>
</div>

<div id="hud" class="hide">
  <div id="score"></div>
  <div id="top"><div class="big" id="alive"></div><div id="roomline"></div></div>
  <div id="tr"><button id="bS2">🔊</button><button id="bExit">✖</button></div>
  <div id="killfeed"></div>
  <div id="windmsg"></div>
  <div id="banner"></div>
  <div id="final" class="hide"></div>
  <div id="lobby" class="hide"></div>
  <div id="emo"><button id="bEmo">💬</button><div id="emobtns" class="hide"></div></div>
  <button id="dash"><span><b>⚡</b><em style="font-style:normal" data-t="dash">РЫВОК</em></span></button>
  <div id="hint"></div>
</div>
<div id="toasts"></div>

<script src="config.js"></script>
<script src="/sdk.js" onerror="void 0"></script>
<script src="sim.js"></script>
<script src="cosmetics.js"></script>
<script src="profile.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
